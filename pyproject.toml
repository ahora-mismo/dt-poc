[project]
name = "dt-agent"
version = "0.1.0"
description = "AI Email & Calendar Assistant"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio>=4.15.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.1",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "mcp>=2.2.0",
    "pydantic-ai-slim[anthropic,google,openai]>=2.51.0",
    "pydantic-evals>=2.51.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
dt-agent = "dt_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Test temp dirs (tmp_path) stay inside the project folder.
addopts = "--ignore=tests/evals --basetemp=.pytest_tmp -m 'not integration'"
# `integration`: real calls to the real app (tests/integration); run with
# `uv run pytest -m integration tests/integration`.
markers = ["integration: real calls to the real app, run only on request"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/dt_agent/logging.py" = ["A005"]

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
