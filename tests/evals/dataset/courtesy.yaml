# Courtesy-reply eval cases (D-39, D-51).
#
# Parsed by `tests/evals/run_evals.py::CourtesyCase`. `label` is the primary label the
# email already received (only MARKETING, INFO_ONLY or TASK ever reach the courtesy
# drafter, D-39). `expected_warranted` is checked by code (`CourtesyWarrantedMatch`). When
# the model's own output is warranted and this case also expects warranted, the body gets
# the same code + judge tone checks as the sales decline (`CourtesyBodyChecks`, against
# `_COURTESY_JUDGE_CRITERIA`, derived from `prompts/courtesy_reply.md`). When the model's
# own output is *not* warranted, the body must be empty, whatever was expected (task 32).
# A case may also pin `expected_body_prefix` (task 50): when set and the model's own
# output is warranted, `CourtesyBodyPrefixMatch` checks the body starts with it
# (case-sensitive after stripping whitespace; straight `'` and curly `’` apostrophes
# count the same).
#
# The urgent-internal-acknowledgement case moved to `dataset/ack.yaml` (D-40, task 43):
# that flow no longer goes through this drafter at all.

- name: warranted_personal_update_on_a_task
  email:
    from_address: robin@acme.example
    from_name: Robin Carter
    subject: Report finished
    body: >
      Just letting you know I finished the report and attached it here --
      let me know if it looks good. Thanks for your patience while I got
      this done!
  label: TASK
  expected_warranted: true

- name: warranted_congratulations_info_only
  email:
    from_address: teamlead@acme.example
    from_name: Team Lead
    subject: We hit our Q3 goal early!
    body: >
      Wanted to share that our team just hit our Q3 goals a month early --
      really proud of everyone's work this quarter.
  label: INFO_ONLY
  expected_warranted: true

