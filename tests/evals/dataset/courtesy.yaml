# Task 50 (D-39): a plain personal thank-you gets "You're welcome" in kind, code-checked
# via `expected_body_prefix`.
- name: warranted_plain_thank_you_gets_youre_welcome
  email:
    from_address: jordan@acme.example
    from_name: Jordan Blake
    subject: Thanks for your help
    body: "Thanks again for your help with the audit last week"
  label: INFO_ONLY
  expected_warranted: true
  expected_body_prefix: "You're welcome"
