# -- Authenticated notice regression coverage (task 51) -----------------------------------
#
# Real, dkim/dmarc-authenticated Google account notices, captured live (mailbox address
# replaced with the eval's own MAILBOX_ADDRESS, long opaque redirect tokens shortened;
# the unshortened source text is kept at `tests/evals/dataset/fixtures/*.txt`). Both were
# once misclassified SPAM by the LLM despite clean authentication and no suspicious
# links/attachments; there is no code-level safety net for a bad SPAM verdict (D-44:
# facts are observations only, task 52), so these cases pin that the classifier itself
# gets the label right (INFO_ONLY) from the facts it's given.

- name: google_security_alert_authenticated_is_info_only
  email:
    from_address: no-reply@accounts.google.com
    from_name: Google
    headers:
      Authentication-Results: "mx.google.com; dkim=pass header.i=@accounts.google.com header.s=20260707; spf=pass (google.com: domain of bounce@accounts.google.com designates 209.85.220.73 as permitted sender) smtp.mailfrom=accounts.google.com; dmarc=pass (p=REJECT sp=REJECT dis=NONE) header.from=accounts.google.com"
    subject: Alertă de securitate
    body: |
      Ai permis accesul Google Auth Library la unele date din Contul Google

      assistant@acme.example

      Dacă nu ai permis accesul Google Auth Library la unele date din Contul tău Google, este posibil ca altcineva să încerce să-ți acceseze datele din cont.

      Verifică acum activitatea contului și securizează-ți contul.

      Verifică activitatea (https://accounts.google.com/AccountChooser?Email=assistant@acme.example&continue=https://myaccount.google.com/alert/nt/1790511095000)

      Pentru a modifica oricând accesul pe care îl are Google Auth Library la datele tale, accesează Contul Google (https://accounts.google.com/AccountChooser?Email=assistant@acme.example&continue=https://myaccount.google.com/connections/overview/abc123)

      Poți vedea activitatea de securitate și la
      https://myaccount.google.com/notifications (https://myaccount.google.com/notifications)

      Ai primit acest e-mail pentru a te informa despre modificările importante aduse serviciilor și Contului Google.

      © 2026 Google Ireland Ltd., Gordon House, Barrow Street, Dublin 4, Ireland
  expected:
    primary: INFO_ONLY
    urgent: false
    subtype: none
    # No date in the body is a deadline for the recipient to act by.
    urgency_requested: false

