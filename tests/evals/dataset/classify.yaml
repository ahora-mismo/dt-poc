# -- Urgency-rule coverage (D-24, task 32) -----------------------------------------------

# "today, end of day" -- modeled with no time (a date with no time counts as that whole
# day, D-64); resolves to a same-day whole-day window, well inside the cutoff. An
# unstable-encoding case: the model could instead emit an explicit end-of-day time,
# which would still resolve the same way but wouldn't canonical-match.
- name: urgency_deadline_today_eod
  email:
    from_address: vendor@externalpartner.com
    from_name: Vendor Contracts
    headers:
      Authentication-Results: "mx.google.com; spf=pass smtp.mailfrom=externalpartner.com; dkim=pass header.d=externalpartner.com; dmarc=pass header.from=externalpartner.com"
    subject: Signed form needed
    body: >
      Please send the signed form back today, end of day.
  expected:
    primary: TASK
    urgent: true
    subtype: none
    deadline:
      kind: relative_days
      phrase: ignored
      days: 0
      time: null
    urgency_requested: false

