# Classification eval cases (D-24, D-25, D-41, D-42, D-44, D-51, D-63).
#
# Parsed by `tests/evals/run_evals.py::ClassifyCase`. Each case's `email` carries only the
# headers/content the classifier's facts actually need (List-Unsubscribe for bulk mail,
# Authentication-Results for internal-sender / spoofing checks, suspicious links for
# phishing). `expected` is checked by two evaluators (task 32): `LabelMatch` (`primary`,
# and `subtype` only for INFO_ONLY, D-63) and `UrgencyMatch` (`deadline`, ignoring
# `phrase`; `urgency_requested`; `urgent`, recomputed by `compute_urgent` against the
# fixed `EVAL_RECEIVED_AT`/`EVAL_TIMEZONE`). For a SPAM case, only `urgent` is checked —
# `deadline`/`urgency_requested` are still pinned (the schema requires them) but not
# must-pass. `deadline` (or its absence, meaning "none") and `urgency_requested` are
# pinned on every case; where a date in the email is explicitly *not* a deadline (a
# meeting time, an offer/event date, a sent/issued date), a comment says so.
#
# Received time for every case: EVAL_RECEIVED_AT = Mon 28 Sep 2026 10:15 EEST. The
# urgency cutoff (D-24: received day + 2, end of day) is Wed 30 Sep 2026 23:59:59 EEST.

- name: meeting_exact_time
  email:
    from_address: dana@partner.com
    from_name: Dana Price
    headers:
      Authentication-Results: "mx.google.com; spf=pass smtp.mailfrom=partner.com; dkim=pass header.d=partner.com; dmarc=pass header.from=partner.com"
    subject: Quick sync?
    body: >
      Can we meet tomorrow at 15:00 to discuss the roadmap for next quarter?
  expected:
    primary: MEETING_REQUEST
    urgent: false
    subtype: none
    # "tomorrow at 15:00" is the proposed meeting time, not a deadline (D-24).
    urgency_requested: false

