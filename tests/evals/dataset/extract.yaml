# `extract_meeting.md` says the sender and approver are "added by other code" but never
# says whether the recipient mailbox (on the To line) counts as part of "everyone on this
# thread" alongside the Cc'd participants -- pinned here as excluded (it's the recipient,
# not an extra attendee to add).
- name: invite_everyone_on_thread_includes_all_to_and_cc
  email:
    from_address: harper@partner.com
    cc:
      - anna@acme.example
      - ben@partner.com
    subject: Scheduling
    body: >
      Let's meet Thursday at 10, please invite everyone on this thread.
  expected:
    proposals:
      - kind: weekday
        phrase: ignored
        weekday: THU
        which: this
        time: "10:00:00"
    extra_attendees:
      - anna@acme.example
      - ben@partner.com

