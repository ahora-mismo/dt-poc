# "or" joins two candidate days, not a range (task 39): one single-day window per day, not
# one window spanning both. Resolved-slot comparison (task 39, `_window_slot_pairs`) absorbs
# the *one-window-vs-two-windows* shape ambiguity this case used to carry -- a model that
# instead returns one TUE-to-WED range window resolves to the same two afternoon slots and
# still passes. It does NOT absorb the "next" *scope* ambiguity (whether "next" modifies
# only "Tuesday" or both weekdays): TUE "next" + WED "this" resolves to a different day (30
# Sep instead of 7 Oct) and still fails here. Pinned as both "next" (the phrase presents
# them as one bounded pair, so both move together). `part_of_day` still carries the sender's own word
# verbatim, resolved to actual hours by deterministic code (`core/dates.py`), never guessed
# by the LLM (task 37).
- name: window_next_tuesday_or_wednesday_afternoon
  email:
    from_address: jamie@partner.com
    subject: Scheduling
    body: "How about next Tuesday or Wednesday afternoon?"
  expected:
    proposals:
      - kind: window
        phrase: ignored
        start:
          kind: weekday
          phrase: ignored
          weekday: TUE
          which: next
        end:
          kind: weekday
          phrase: ignored
          weekday: TUE
          which: next
        part_of_day: afternoon
      - kind: window
        phrase: ignored
        start:
          kind: weekday
          phrase: ignored
          weekday: WED
          which: next
        end:
          kind: weekday
          phrase: ignored
          weekday: WED
          which: next
        part_of_day: afternoon

- name: window_single_day_explicit_clock_times
  email:
    from_address: robin@partner.com
    subject: Scheduling
    body: "How about next Tuesday between 2 and 4pm?"
  expected:
    proposals:
      # A single-day window: start and end are the same weekday bound, narrowed by an
      # explicit clock range rather than a part-of-day word (D-64: `duration_minutes`
      # stays unset -- unlike "from 2pm to 3pm", this is a window, not one timed meeting).
      - kind: window
        phrase: ignored
        start:
          kind: weekday
          phrase: ignored
          weekday: TUE
          which: next
        end:
          kind: weekday
          phrase: ignored
          weekday: TUE
          which: next
        start_time: "14:00:00"
        end_time: "16:00:00"

