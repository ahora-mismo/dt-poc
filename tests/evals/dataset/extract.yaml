# Meeting-extraction eval cases (D-64, D-51).
#
# Parsed by `tests/evals/run_evals.py::ExtractCase`. Every `phrase` field below is a
# placeholder ("ignored"): the evaluator strips `phrase` before comparing, per D-51
# ("date expressions (kind + fields), ignore the `phrase` text"). Every email is given
# the same fixed received time (`EVAL_RECEIVED_AT`, Mon 2026-09-28 10:15 EEST), though the
# extractor prompt never actually sees it (D-64: the LLM restates the sender's words only).
#
# `location` (task 32) is checked by exact string match, verbatim.
#
# Left out (D-51: very ambiguous cases are left out): a numeric date like "05/06", whose
# reading (5 June vs. 6 May) no stated rule decides.

- name: relative_days_tomorrow_at_time
  email:
    from_address: dana@partner.com
    subject: Scheduling
    body: "Can we meet tomorrow at 15:00?"
  expected:
    proposals:
      - kind: relative_days
        phrase: ignored
        days: 1
        time: "15:00:00"

